{{- if .Values.secrets.enabled }}
{{- if not .Values.litemaas.apiKey }}
{{- fail "litemaas.apiKey is empty. Field Content / RHDP must inject LiteMaaS credentials, or set them for local helm template tests." }}
{{- end }}
{{- if not .Values.litemaas.apiUrl }}
{{- fail "litemaas.apiUrl is empty. Field Content / RHDP must inject LiteMaaS credentials, or set them for local helm template tests." }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Values.secrets.namespace }}
  labels:
    demo.redhat.com/application: "holmesgpt-fsc"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: {{ .Values.secrets.type }}
stringData:
  OPENAI_API_KEY: {{ .Values.litemaas.apiKey | quote }}
  OPENAI_API_BASE: {{ .Values.litemaas.apiUrl | quote }}
  {{- if .Values.litemaas.model }}
  LITEMAAS_MODEL: {{ .Values.litemaas.model | quote }}
  {{- end }}
{{- end }}
