{{- if .Values.webTerminal.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.webTerminal.name }}-usage
  namespace: {{ .Values.webTerminal.namespace }}
  labels:
    demo.redhat.com/application: "holmesgpt-fsc"
    app: holmes-cli-terminal
  annotations:
    argocd.argoproj.io/sync-wave: "4"
data:
  README.txt: |
    Holmes CLI Web Terminal image (built by BuildConfig in this namespace).

    Image (in-cluster pullspec):
      image-registry.openshift-image-registry.svc:5000/{{ .Values.webTerminal.namespace }}/{{ .Values.webTerminal.name }}:latest

    How to use
    ----------
    1. Wait for BuildConfig / ImageStream:
         oc -n {{ .Values.webTerminal.namespace }} get is {{ .Values.webTerminal.name }}
         # TAGS must include latest

    2. Cross-namespace pull RBAC is applied by GitOps:
         RoleBinding {{ .Values.webTerminal.name }}-openshift-terminal-puller
       Without it, Web Terminal fails with ImagePullBackOff / authentication required.

    3. Open the OpenShift console Web Terminal.
       - If a previous attempt Failed:
           oc -n openshift-terminal delete dw --all
       - Before Start, click Image and paste the pullspec above
         (or set cluster default: Cluster Settings → Console → Customize → Web Terminal).

    4. In the terminal:
         holmes version
         source holmes-demo-env
         holmes ask 'list pods in namespace {{ .Values.webTerminal.namespace }}' --model=openai/${LITEMAAS_MODEL}

    Notes
    -----
    - holmes-demo-env reads Secret {{ .Values.webTerminal.namespace }}/holmes-litemaas (needs get secret).
    - Non-admin terminals in another project: add that NS to webTerminal.extraPullNamespaces.
    - AlertManager investigate is the CLI path (not CronJob).
{{- end }}
