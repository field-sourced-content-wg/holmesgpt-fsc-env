{{- if .Values.webTerminal.enabled }}
{{- /*
  Web Terminal pods run in openshift-terminal (cluster-admins) or a user project.
  Internal registry images in holmesgpt require cross-namespace image-puller RBAC,
  otherwise the tooling container stays in ImagePullBackOff (authentication required).
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.webTerminal.name }}-openshift-terminal-puller
  namespace: {{ .Values.webTerminal.namespace }}
  labels:
    demo.redhat.com/application: "holmesgpt-fsc"
    app: holmes-cli-terminal
  annotations:
    argocd.argoproj.io/sync-wave: "4"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:serviceaccounts:openshift-terminal
{{- if .Values.webTerminal.extraPullNamespaces }}
{{- range .Values.webTerminal.extraPullNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Values.webTerminal.name }}-{{ . }}-puller
  namespace: {{ $.Values.webTerminal.namespace }}
  labels:
    demo.redhat.com/application: "holmesgpt-fsc"
    app: holmes-cli-terminal
  annotations:
    argocd.argoproj.io/sync-wave: "4"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:serviceaccounts:{{ . }}
{{- end }}
{{- end }}
{{- end }}
