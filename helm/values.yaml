# holmesgpt-fsc-env - App of Apps
# Argo CD で holmes-secrets と robusta/holmes をデプロイする

# ============================================================
# GitOps Configuration
# ============================================================
gitops:
  # UPDATE: このリポジトリの clone URL
  repoUrl: "https://github.com/field-sourced-content-wg/holmesgpt-fsc-env.git"
  revision: "main"
  basePath: "helm"

argocd:
  namespace: openshift-gitops
  project: default

# ============================================================
# HolmesGPT
# ============================================================
holmes:
  enabled: true
  # Argo CD Application / Helm release 名（Service は {name}-holmes）
  name: holmes
  namespace: holmesgpt
  # robusta Helm repository
  chart:
    repoURL: "https://robusta-charts.storage.googleapis.com"
    name: holmes
    # Pin for reproducibility. Bump deliberately after testing.
    version: "0.43.0"
  # Secret created by components/holmes-secrets
  secretName: holmes-litemaas
  # modelList のキー。/api/chat の "model" に使う
  modelKey: litemaas
  openshift: true
  enableTelemetry: false
  operator:
    enabled: true
    holmesApiTimeout: 300
    maxHistoryItems: 10
  toolsets:
    kubernetes/core:
      enabled: true
    kubernetes/logs:
      enabled: true
    # Disabled: Holmes image has no `oc` binary (toolset init fails with exit 127).
    openshift/core:
      enabled: false
    openshift/logs:
      enabled: false
    robusta:
      enabled: false
    internet:
      enabled: false
    # OpenShift: SA token is auto-injected when openshift=true (IS_OPENSHIFT).
    # URL points at Thanos Querier (platform monitoring).
    prometheus/metrics:
      enabled: true
      subtype: prometheus
      config:
        prometheus_url: "https://thanos-querier.openshift-monitoring.svc.cluster.local:9091"
        verify_ssl: false
  resources:
    requests:
      cpu: 100m
      memory: 1024Mi
    limits:
      memory: 1024Mi

# ============================================================
# HealthCheck probe (Operator) — can Prometheus see firing alerts?
# ============================================================
healthCheck:
  enabled: true
  name: firing-alerts-probe
  namespace: holmesgpt
  model: litemaas
  timeout: 180
  mode: monitor
  # Verification probe: PASS when Prometheus tools work, even if alerts fire.
  # (Chat API can query ALERTS; a weak model may skip tools and falsely "fail".)
  query: |
    You MUST call Prometheus tools before answering (for example
    execute_prometheus_instant_query with query ALERTS{alertstate="firing"},
    or list_prometheus_rules with type=alert).
    PASS if the Prometheus query succeeds. Report how many firing alert series
    you saw (zero is fine). Do NOT fail merely because alerts are currently firing.
    FAIL only if Prometheus tools error, time out, or cannot authenticate.

# ============================================================
# Holmes CLI Web Terminal (BuildConfig → ImageStream)
# ============================================================
# Web Terminal Operator (separate App → openshift-operators)
webTerminalOperator:
  enabled: true
  name: web-terminal
  namespace: openshift-operators
  channel: fast
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic

# Holmes CLI tooling image (BuildConfig in holmesgpt)
webTerminal:
  enabled: true
  namespace: holmesgpt
  name: holmes-cli-terminal
  git:
    # Empty → use gitops.repoUrl / revision
    uri: ""
    revision: ""
    contextDir: container/holmes-web-terminal
  dockerfilePath: Dockerfile
  # Do not patch cluster DevWorkspaceTemplate (shared RHDP)
  patchClusterTemplate: false

# ============================================================
# Secrets (LiteMaaS → Holmes)
# ============================================================
secrets:
  enabled: true
  name: holmes-litemaas
  namespace: holmesgpt
  type: Opaque

# ============================================================
# OpenShift Route (Holmes Service is ClusterIP only)
# ============================================================
route:
  enabled: true
  name: holmes
  namespace: holmesgpt
  # Must match Holmes Helm releaseName + "-holmes"
  serviceName: holmes-holmes
  servicePort: 80
  # Empty host + deployer.domain → holmes-holmesgpt.<domain>
  # Empty host and empty domain → OpenShift auto-assigns
  host: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect


# ============================================================
# Values injected by field content workload (do not modify)
# ============================================================
deployer:
  domain: ""
  apiUrl: ""

fieldContent:
  deploymentType: "helm"

# RHDP / Field Content が注文時に埋める
litemaas:
  enabled: true
  apiUrl: ""
  apiKey: ""
  model: ""
