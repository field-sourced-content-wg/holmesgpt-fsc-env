{{- if .Values.webTerminal.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-holmes-web-terminal
  namespace: {{ .Values.argocd.namespace }}
  labels:
    demo.redhat.com/application: "holmesgpt-fsc"
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoUrl }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.basePath }}/components/holmes-web-terminal
    helm:
      valuesObject:
        webTerminal:
          enabled: {{ .Values.webTerminal.enabled }}
          namespace: {{ .Values.webTerminal.namespace }}
          name: {{ .Values.webTerminal.name }}
          git:
            uri: {{ .Values.webTerminal.git.uri | default .Values.gitops.repoUrl | quote }}
            revision: {{ .Values.webTerminal.git.revision | default .Values.gitops.revision | quote }}
            contextDir: {{ .Values.webTerminal.git.contextDir | quote }}
          dockerfilePath: {{ .Values.webTerminal.dockerfilePath | quote }}
          patchClusterTemplate: {{ .Values.webTerminal.patchClusterTemplate }}
          extraPullNamespaces:
            {{- toYaml .Values.webTerminal.extraPullNamespaces | nindent 12 }}
        gitops:
          repoUrl: {{ .Values.gitops.repoUrl | quote }}
          revision: {{ .Values.gitops.revision | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.webTerminal.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m
{{- end }}
